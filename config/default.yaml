# All the numbers and paths a run needs, in one place — nothing below should be
# hardcoded in src/. Loaded with ai_music_origin.config.load_config().

seed: 42

paths:
  raw_data: data/raw/fakemusiccaps
  metadata: data/interim/split_metadata.csv
  results: results

split:
  validation_size: 0.15
  test_size: 0.15
  group_by: track_id

cv:
  n_splits: 5

model:
  # Classifiers compared in notebook 03 (see results/README.md).
  active: svm
  logistic_regression:
    max_iter: 1000
    C: 1.0
  svm:
    kernel: rbf
    C: 1.0
    gamma: scale
  knn:
    n_neighbors: 5
    weights: uniform

  random_forest:
    n_estimators: 200
    max_depth: null

logging:
  level: INFO

# Only used if you publish the model to Hugging Face Hub (see models/README.md).
# Leave repo_id blank to disable the HF fallback in load_model().
huggingface:
  repo_id: ""
